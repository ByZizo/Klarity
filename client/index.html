<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/klarity-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Klarity</title>
    <script>
      (function() {
        try {
          localStorage.removeItem('klarity_theme');
          var root = document.documentElement;
          root.classList.remove('dark', 'high-contrast', 'high-contrast-light');
          if (document.body) document.body.classList.remove('dark');

          var fontScale = localStorage.getItem('klarity_ui_font_scale') || 'normal';
          var density = localStorage.getItem('klarity_ui_density') || 'comfortable';
          var reduceMotion = localStorage.getItem('klarity_ui_reduce_motion') === 'true';
          var highFocus = localStorage.getItem('klarity_ui_high_focus') === 'true';
          var privacyMask = localStorage.getItem('klarity_ui_privacy_mask') === 'true';

          if (fontScale === 'large') root.classList.add('font-scale-large');
          if (fontScale === 'xlarge') root.classList.add('font-scale-xlarge');
          if (density === 'compact') root.classList.add('ui-density-compact');
          if (reduceMotion) root.classList.add('reduce-motion');
          if (highFocus) root.classList.add('high-focus');
          if (privacyMask) root.classList.add('privacy-mask');
        } catch (e) {}
      })();
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f8fafc] text-slate-800 antialiased min-h-screen font-sans selection:bg-blue-100 selection:text-blue-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
